name: Validate single-position formatting

on:
  push:
    branches:
      - agent/fix-speculative-candidate-q

permissions:
  contents: write

jobs:
  format-and-check:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/fix-speculative-candidate-q

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Apply formatting fix
        run: python .github/scripts/format_single_position_fix.py

      - name: Run Ruff
        run: |
          python -m pip install ruff
          ruff check src/transformers/generation/candidate_generator.py tests/generation/test_single_position_candidate_generator.py
          ruff format --check src/transformers/generation/candidate_generator.py tests/generation/test_single_position_candidate_generator.py

      - name: Commit formatted source
        uses: stefanzweifel/git-auto-commit-action@v6
        with:
          commit_message: format single-position speculative fix
          file_pattern: src/transformers/generation/candidate_generator.py
